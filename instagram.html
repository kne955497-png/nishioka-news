<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:Arial,sans-serif;overflow:hidden}
.wrap{position:relative;width:100%;max-width:480px;margin:0 auto;padding:4px 4px 28px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.gallery::-webkit-scrollbar{display:none}
.gallery a{display:block;flex:0 0 100%;aspect-ratio:1;overflow:hidden;background:#eee;scroll-snap-align:start}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.arrow{position:absolute;top:calc(50% - 14px);transform:translateY(-50%);z-index:2;border:0;border-radius:50%;width:36px;height:36px;background:rgba(0,0,0,.65);color:#fff;font-size:24px;cursor:pointer}
.prev{left:10px}.next{right:10px}
.dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#bbb}
.dot.active{background:#333}
@media(prefers-reduced-motion:reduce){.gallery{scroll-behavior:auto}}

<script>
const gallery=document.getElementById('gallery');
const slides=[...gallery.querySelectorAll('a')];
const dots=document.getElementById('dots');
const wrap=document.getElementById('wrap');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let current=0, timer;
for(let i=0;i<Math.min(slides.length,10);i++){const dot=document.createElement('span');dot.className='dot';dots.appendChild(dot);}
function render(){const all=[...dots.children];all.forEach((d,i)=>d.classList.toggle('active',i===current%all.length));}
function go(i){if(!slides.length)return;current=(i+slides.length)%slides.length;gallery.scrollTo({left:slides[current].offsetLeft-slides[0].offsetLeft,behavior:reduced?'auto':'smooth'});render();}
function start(){stop();if(!reduced&&slides.length>1)timer=setInterval(()=>go(current+1),4000);}
function stop(){if(timer)clearInterval(timer);timer=null;}
document.querySelector('.prev').addEventListener('click',()=>{go(current-1);start();});
document.querySelector('.next').addEventListener('click',()=>{go(current+1);start();});
let scrollTimer;
gallery.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const width=gallery.clientWidth;if(width){current=Math.min(slides.length-1,Math.max(0,Math.round(gallery.scrollLeft/width)));render();}},120);},{passive:true});
wrap.addEventListener('mouseenter',stop);wrap.addEventListener('mouseleave',start);
wrap.addEventListener('focusin',stop);wrap.addEventListener('focusout',start);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start();});
render();start();
</script></body></html>
