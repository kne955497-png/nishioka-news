<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: Arial, "Noto Sans JP", sans-serif;
  color: #000;
}

/* NEWS全体：ここをスクロール */
.news-list {
  width: 100%;
  height: 360px;
  overflow-y: auto;
  overflow-x: hidden;
}

/* NEWS 1件 */
.news-item {
  width: 100%;
  min-height: 120px;

  display: flex;
  align-items: center;
  gap: 24px;

  padding: 24px 5px;
  border-bottom: 1px solid #222;
}

.date {
  width: 220px;
  flex-shrink: 0;

  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  white-space: nowrap;
}

.message {
  flex: 1;

  font-size: 22px;
  font-weight: 700;
}

.button {
  width: 130px;
  height: 58px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 2px solid #111;

  color: #111;
  text-decoration: none;
  font-size: 17px;
}

.button:hover {
  background: #f5f5f5;
}

/* スマホ */
@media (max-width: 700px) {

  .news-list {
    height: 300px;
  }

  .news-item {
    min-height: 100px;
    gap: 8px;
    padding: 15px 5px;
  }

  .date {
    width: auto;
    font-size: 12px;
  }

  .message {
    font-size: 12px;
  }

  .button {
    width: 62px;
    height: 40px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="news-list" id="youtube-news-list">

  <!-- YOUTUBE_NEWS_START -->

  <div class="news-item">
    <div class="date">2026.09.22</div>

    <div class="message">
      YOUTUBEがUPされました！
    </div>

    <a
      class="button"
      href="https://www.youtube.com/watch?v=jfLXaCDFoJI"
      target="_blank"
      rel="noopener noreferrer"
    >
      クリック
    </a>
  </div>

  <!-- YOUTUBE_NEWS_END -->

</div>

</body>
</html>
