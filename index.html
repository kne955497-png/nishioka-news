<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: Arial, "Noto Sans JP", sans-serif;
  color: #000;
}

.news-item {
  width: 100%;
  min-height: 175px;

  display: flex;
  align-items: center;

  border-bottom: 1px solid #222;
  padding: 25px 0;
}

.date {
  width: 255px;
  flex-shrink: 0;

  font-size: 28px;
  font-weight: 700;
  letter-spacing: 1px;
}

.message {
  flex: 1;

  font-size: 28px;
  font-weight: 700;
}

.button {
  width: 160px;
  height: 72px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 2px solid #111;

  color: #111;
  text-decoration: none;
  font-size: 20px;

  flex-shrink: 0;
}

.button:hover {
  background: #f5f5f5;
}

/* スマホ */
@media (max-width: 700px) {

  .news-item {
    min-height: 100px;
    padding: 15px 5px;
    gap: 8px;
  }

  .date {
    width: auto;
    font-size: 13px;
    white-space: nowrap;
  }

  .message {
    font-size: 13px;
  }

  .button {
    width: 65px;
    height: 42px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="news-item">

  <div class="date" id="youtube-date">2026.09.22</div>

  <div class="message">
    YOUTUBEがUPされました！
  </div>

  <a
    class="button"
    id="youtube-link"
    href="https://www.youtube.com/watch?v=jfLXaCDFoJI"
    target="_blank"
    rel="noopener noreferrer"
  >
    クリック
  </a>

</div>

</body>
</html>
