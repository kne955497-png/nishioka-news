          token = os.environ['INSTAGRAM_ACCESS_TOKEN']
          channel = 'UChM1p5-nq7415z568WGx5hw'
          jst = timezone(timedelta(hours=9))
          news = []
          gallery = []

          def api_get(base, params):
              url = base + '?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as response:
                  return json.load(response)

          search = api_get('https://www.googleapis.com/youtube/v3/search', {
              'part': 'snippet', 'channelId': channel, 'maxResults': 30,
              'order': 'date', 'type': 'video', 'key': key
          })
          ids = [x.get('id', {}).get('videoId') for x in search.get('items', [])]
          ids = [x for x in ids if x]
          if ids:
              videos = api_get('https://www.googleapis.com/youtube/v3/videos', {
                  'part': 'snippet', 'id': ','.join(ids), 'key': key
              })
              for video in videos.get('items', []):
                  published = video.get('snippet', {}).get('publishedAt')
                  if not published:
                      continue
                  dt = datetime.fromisoformat(published.replace('Z', '+00:00')).astimezone(jst)
                  news.append({'datetime': dt, 'source': 'YOUTUBE',
                               'url': 'https://www.youtube.com/watch?v=' + video['id']})
          print('YouTube:', len(ids), '件')

          params = {
              'fields': 'id,media_type,media_url,thumbnail_url,permalink,timestamp,children{media_type,media_url,thumbnail_url}',
              'limit': 50, 'access_token': token
          }
          ig_data = api_get('https://graph.instagram.com/me/media', params)
          for item in ig_data.get('data', []):
              link = item.get('permalink')
              timestamp = item.get('timestamp')
              if not link or not timestamp:
                  continue
              dt = datetime.fromisoformat(timestamp.replace('Z', '+00:00')).astimezone(jst)
              news.append({'datetime': dt, 'source': 'INSTAGRAM', 'url': link})
              kind = item.get('media_type')
              picture = item.get('thumbnail_url') if kind == 'VIDEO' else item.get('media_url')
              if kind == 'CAROUSEL_ALBUM' and not picture:
                  children = item.get('children', {}).get('data', [])
                  if children:
                      first = children[0]
                      picture = first.get('thumbnail_url') if first.get('media_type') == 'VIDEO' else first.get('media_url')
              if picture:
                  gallery.append({'datetime': dt, 'url': link, 'image': picture})
          print('Instagram:', len(ig_data.get('data', [])), '件; 画像:', len(gallery), '件')

          news.sort(key=lambda x: x['datetime'], reverse=True)
          gallery.sort(key=lambda x: x['datetime'], reverse=True)
          print('===== NEWS 最新10件 =====')
          for item in news[:10]:
              print(item['datetime'].strftime('%Y.%m.%d %H:%M'), item['source'], item['url'])

          entries = []
          for item in news:
              date = item['datetime'].strftime('%Y.%m.%d')
              link = html_lib.escape(item['url'], quote=True)
              entries.append(f'''<div class="news-item">
                <div class="date">{date}</div>
                <div class="message">{item['source']}がUPされました！</div>
                <a class="button" href="{link}" target="_blank" rel="noopener noreferrer">クリック</a>
              </div>''')

          with open('index.html', encoding='utf-8') as f:
              index = f.read()
          start = '<!-- YOUTUBE_NEWS_START -->'
          end = '<!-- YOUTUBE_NEWS_END -->'
          if index.count(start) != 1 or index.count(end) != 1:
              raise RuntimeError('NEWS用マーカーが1組必要です')
          index = re.sub(re.escape(start) + r'.*?' + re.escape(end),
                         lambda m: start + '\n' + '\n'.join(entries) + '\n' + end,
                         index, count=1, flags=re.DOTALL)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index)

          tiles = []
          for item in gallery[:30]:
              link = html_lib.escape(item['url'], quote=True)
              picture = html_lib.escape(item['image'], quote=True)
              date = item['datetime'].strftime('%Y.%m.%d')
              tiles.append(f'<a href="{link}" target="_blank" rel="noopener noreferrer" aria-label="Instagram投稿 {date}"><img src="{picture}" alt="Instagram投稿 {date}" loading="lazy"></a>')
          template = '''<!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <style>*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,sans-serif}
          .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:4px}
          .gallery a{display:block;aspect-ratio:1;overflow:hidden;background:#eee}
          .gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
          .gallery a:hover img{transform:scale(1.04)}
          @media(max-width:500px){.gallery{gap:4px;padding:2px}}</style></head>
          <body><div class="gallery">{{TILES}}</div></body></html>'''
          with open('instagram.html', 'w', encoding='utf-8') as f:
              f.write(template.replace('{{TILES}}', '\n'.join(tiles)))
          print('合計NEWS:', len(news), '件 / Instagram画像:', len(tiles), '件')
          PY

      - name: Save NEWS and Instagram gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html instagram.html
          if git diff --cached --quiet; then
            echo "NEWSとInstagram画像はすでに最新です"
          else
            git commit -m "Update news and Instagram gallery"
            git push
          fi
