name: Update YouTube News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest YouTube video
        shell: bash
        run: |
          set -e

          CHANNEL_ID="UChM1p5-nq7415z568WGx5hw"
          RSS="https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
            --header "Accept: application/atom+xml,application/xml,text/xml,*/*" \
            "$RSS" \
            -o youtube.xml

          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          root = ET.parse("youtube.xml").getroot()

          ns = {
              "atom": "http://www.w3.org/2005/Atom"
          }

          entry = root.find("atom:entry", ns)

          if entry is None:
              raise Exception("最新動画が見つかりません")

          published = entry.find("atom:published", ns).text

          video_url = None

          for link in entry.findall("atom:link", ns):
              if link.attrib.get("rel") == "alternate":
                  video_url = link.attrib["href"]
                  break

          if not video_url:
              raise Exception("動画URLが見つかりません")

          dt = datetime.fromisoformat(
              published.replace("Z", "+00:00")
          ).astimezone(ZoneInfo("Asia/Tokyo"))

          date = dt.strftime("%Y.%m.%d")

          with open("index.html", encoding="utf-8") as f:
              html = f.read()

          html = re.sub(
              r'<div class="date" id="youtube-date">.*?</div>',
              f'<div class="date" id="youtube-date">{date}</div>',
              html,
              flags=re.S
          )

          html = re.sub(
              r'id="youtube-link"\s+href="[^"]*"',
              f'id="youtube-link" href="{video_url}"',
              html
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("DATE:", date)
          print("VIDEO:", video_url)
          PY

      - name: Save update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Update YouTube news"
            git push
          fi
