name: Update YouTube News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get YouTube videos and update NEWS
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import urllib.request
          import urllib.parse
          from datetime import datetime

          # 西岡TubeのチャンネルID
          CHANNEL_ID = "UChM1p5-nq7415z568WGx5hw"

          API_KEY = os.environ["YOUTUBE_API_KEY"]

          # ----------------------------------------
          # 1. チャンネルの「アップロード動画」プレイリストIDを取得
          # ----------------------------------------

          params = urllib.parse.urlencode({
              "part": "contentDetails",
              "id": CHANNEL_ID,
              "key": API_KEY
          })

          url = (
              "https://www.googleapis.com/youtube/v3/channels?"
              + params
          )

          with urllib.request.urlopen(url) as response:
              channel_data = json.load(response)

          if not channel_data.get("items"):
              raise Exception(
                  "チャンネル情報を取得できませんでした。"
                  "CHANNEL_IDまたはAPIキーを確認してください。"
              )

          uploads_playlist_id = (
              channel_data["items"][0]
              ["contentDetails"]
              ["relatedPlaylists"]
              ["uploads"]
          )

          print("Uploads playlist:", uploads_playlist_id)

          # ----------------------------------------
          # 2. 最新30本を取得
          # ----------------------------------------

          params = urllib.parse.urlencode({
              "part": "snippet,contentDetails",
              "playlistId": uploads_playlist_id,
              "maxResults": 30,
              "key": API_KEY
          })

          url = (
              "https://www.googleapis.com/youtube/v3/playlistItems?"
              + params
          )

          with urllib.request.urlopen(url) as response:
              playlist_data = json.load(response)

          videos = []

          for item in playlist_data.get("items", []):

              video_id = item["contentDetails"]["videoId"]

              # 実際に動画が公開された日時
              published_at = (
                  item["contentDetails"].get("videoPublishedAt")
                  or item["snippet"]["publishedAt"]
              )

              # YouTubeはUTCなのでdatetimeとして読み込む
              dt = datetime.fromisoformat(
                  published_at.replace("Z", "+00:00")
              )

              # NEWS表示用
              date = dt.strftime("%Y.%m.%d")

              videos.append({
                  "date": date,
                  "url": (
                      "https://www.youtube.com/watch?v="
                      + video_id
                  )
              })

              print(date, video_id)

          if not videos:
              raise Exception("動画を取得できませんでした")

          # ----------------------------------------
          # 3. NEWSのHTMLを作成
          # ----------------------------------------

          news_items = []

          for video in videos:

              news_items.append(f'''
            <div class="news-item">

              <div class="date">
                {video["date"]}
              </div>

              <div class="message">
                YOUTUBEがUPされました！
              </div>

              <a
                class="button"
                href="{video["url"]}"
                target="_blank"
                rel="noopener noreferrer"
              >
                クリック
              </a>

            </div>''')

          generated_news = "\n".join(news_items)

          # ----------------------------------------
          # 4. index.htmlを書き換え
          # ----------------------------------------

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          start_marker = "<!-- YOUTUBE_NEWS_START -->"
          end_marker = "<!-- YOUTUBE_NEWS_END -->"

          if start_marker not in html or end_marker not in html:
              raise Exception(
                  "index.htmlにNEWS用マーカーがありません"
              )

          pattern = (
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker)
          )

          replacement = (
              start_marker
              + "\n"
              + generated_news
              + "\n\n  "
              + end_marker
          )

          html = re.sub(
              pattern,
              replacement,
              html,
              flags=re.DOTALL
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("取得件数:", len(videos))
          print("NEWS更新完了")

          PY

      - name: Save NEWS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "NEWSはすでに最新です"
          else
            git commit -m "Update YouTube news list"
            git push
          fi
