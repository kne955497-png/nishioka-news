name: Update YouTube & Instagram News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update NEWS
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone, timedelta

          # =========================
          # 設定
          # =========================

          YOUTUBE_API_KEY = os.environ["YOUTUBE_API_KEY"]
          INSTAGRAM_ACCESS_TOKEN = os.environ["INSTAGRAM_ACCESS_TOKEN"]

          YOUTUBE_CHANNEL_ID = "UChM1p5-nq7415z568WGx5hw"

          JST = timezone(timedelta(hours=9))

          news = []


          # =========================
          # YouTube
          # =========================

          print("YouTubeを取得中...")

          # まず最新動画のIDを取得
          search_params = urllib.parse.urlencode({
              "part": "snippet",
              "channelId": YOUTUBE_CHANNEL_ID,
              "maxResults": 30,
              "order": "date",
              "type": "video",
              "key": YOUTUBE_API_KEY
          })

          search_url = (
              "https://www.googleapis.com/youtube/v3/search?"
              + search_params
          )

          with urllib.request.urlopen(search_url) as response:
              search_data = json.load(response)

          video_ids = []

          for item in search_data.get("items", []):
              video_id = item.get("id", {}).get("videoId")

              if video_id:
                  video_ids.append(video_id)

          print("YouTube動画ID:", len(video_ids), "件")


          # 各動画の正式な公開日時を取得
          if video_ids:

              videos_params = urllib.parse.urlencode({
                  "part": "snippet",
                  "id": ",".join(video_ids),
                  "key": YOUTUBE_API_KEY
              })

              videos_url = (
                  "https://www.googleapis.com/youtube/v3/videos?"
                  + videos_params
              )

              with urllib.request.urlopen(videos_url) as response:
                  videos_data = json.load(response)

              for item in videos_data.get("items", []):

                  video_id = item["id"]

                  snippet = item.get("snippet", {})

                  published = snippet.get("publishedAt")

                  if not published:
                      continue

                  dt = datetime.fromisoformat(
                      published.replace("Z", "+00:00")
                  ).astimezone(JST)

                  news.append({
                      "datetime": dt,
                      "date": dt.strftime("%Y.%m.%d"),
                      "message": "YOUTUBEがUPされました！",
                      "url": f"https://www.youtube.com/watch?v={video_id}",
                      "source": "YouTube"
                  })

                  print(
                      "YouTube:",
                      dt.strftime("%Y.%m.%d %H:%M"),
                      video_id
                  )


          # =========================
          # Instagram
          # =========================

          print("Instagramを取得中...")

          fields = "id,media_type,media_url,permalink,timestamp"

          instagram_params = urllib.parse.urlencode({
              "fields": fields,
              "limit": 30,
              "access_token": INSTAGRAM_ACCESS_TOKEN
          })

          instagram_url = (
              "https://graph.instagram.com/me/media?"
              + instagram_params
          )

          try:

              with urllib.request.urlopen(instagram_url) as response:
                  instagram_data = json.load(response)

              instagram_count = 0

              for item in instagram_data.get("data", []):

                  permalink = item.get("permalink")
                  timestamp = item.get("timestamp")

                  if not permalink or not timestamp:
                      continue

                  dt = datetime.fromisoformat(
                      timestamp.replace("Z", "+00:00")
                  ).astimezone(JST)

                  news.append({
                      "datetime": dt,
                      "date": dt.strftime("%Y.%m.%d"),
                      "message": "INSTAGRAMがUPされました！",
                      "url": permalink,
                      "source": "Instagram"
                  })

                  instagram_count += 1

              print("Instagram:", instagram_count, "件")

          except Exception as e:
              print("Instagram取得エラー:", e)
              raise


          # =========================
          # 新しい順に並び替え
          # =========================

          news.sort(
              key=lambda x: x["datetime"],
              reverse=True
          )


          # =========================
          # 確認用ログ
          # =========================

          print("")
          print("===== NEWS 最新10件 =====")

          for item in news[:10]:

              print(
                  item["datetime"].strftime("%Y.%m.%d %H:%M"),
                  "|",
                  item["source"],
                  "|",
                  item["url"]
              )

          print("=========================")
          print("")


          # =========================
          # HTML生成
          # =========================

          news_items = []

          for item in news:

              news_items.append(f'''
            <div class="news-item">

              <div class="date">
                {item["date"]}
              </div>

              <div class="message">
                {item["message"]}
              </div>

              <a
                class="button"
                href="{item["url"]}"
                target="_blank"
                rel="noopener noreferrer"
              >
                クリック
              </a>

            </div>''')

          generated_news = "\n".join(news_items)


          # =========================
          # index.html更新
          # =========================

          with open(
              "index.html",
              "r",
              encoding="utf-8"
          ) as f:
              html = f.read()

          start_marker = "<!-- YOUTUBE_NEWS_START -->"
          end_marker = "<!-- YOUTUBE_NEWS_END -->"

          if start_marker not in html or end_marker not in html:
              raise Exception(
                  "NEWS用マーカーがありません"
              )

          pattern = (
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker)
          )

          replacement = (
              start_marker
              + "\n"
              + generated_news
              + "\n\n  "
              + end_marker
          )

          html = re.sub(
              pattern,
              replacement,
              html,
              flags=re.DOTALL
          )

          with open(
              "index.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(html)

          print("合計:", len(news), "件")

          PY

      - name: Save NEWS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "NEWSはすでに最新です"
          else
            git commit -m "Update YouTube and Instagram news"
            git push
          fi
