name: Update YouTube News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Get YouTube videos and update NEWS
        run: |
          python3 <<'PY'
          import subprocess
          import json
          import re
          from datetime import datetime

          CHANNEL_URL = "https://www.youtube.com/@tube2669/videos"
          MAX_VIDEOS = 30

          # 動画一覧を取得
          playlist_result = subprocess.run(
              [
                  "yt-dlp",
                  "--flat-playlist",
                  "--playlist-end", str(MAX_VIDEOS),
                  "--dump-json",
                  CHANNEL_URL
              ],
              capture_output=True,
              text=True,
              check=True
          )

          entries = []

          for line in playlist_result.stdout.splitlines():
              if line.strip():
                  entries.append(json.loads(line))

          if not entries:
              raise Exception("YouTube動画一覧を取得できませんでした")

          videos = []

          # 各動画から投稿日を取得
          for number, entry in enumerate(entries, start=1):

              video_id = entry.get("id")

              if not video_id:
                  continue

              video_url = f"https://www.youtube.com/watch?v={video_id}"

              print(f"{number}/{len(entries)} : {video_url}")

              try:
                  detail_result = subprocess.run(
                      [
                          "yt-dlp",
                          "--skip-download",
                          "--dump-single-json",
                          video_url
                      ],
                      capture_output=True,
                      text=True,
                      check=True
                  )

                  detail = json.loads(detail_result.stdout)

                  upload_date = detail.get("upload_date")

                  if upload_date and len(upload_date) == 8:
                      date = datetime.strptime(
                          upload_date,
                          "%Y%m%d"
                      ).strftime("%Y.%m.%d")
                  else:
                      date = "----.--.--"

              except Exception as e:
                  print(
                      f"投稿日取得失敗: {video_id} / {e}"
                  )
                  date = "----.--.--"

              videos.append({
                  "date": date,
                  "url": video_url
              })

          if not videos:
              raise Exception("表示できる動画がありません")

          news_items = []

          for video in videos:

              news_items.append(f'''
            <div class="news-item">

              <div class="date">
                {video["date"]}
              </div>

              <div class="message">
                YOUTUBEがUPされました！
              </div>

              <a
                class="button"
                href="{video["url"]}"
                target="_blank"
                rel="noopener noreferrer"
              >
                クリック
              </a>

            </div>''')

          generated_news = "\n".join(news_items)

          with open(
              "index.html",
              "r",
              encoding="utf-8"
          ) as f:
              html = f.read()

          start_marker = "<!-- YOUTUBE_NEWS_START -->"
          end_marker = "<!-- YOUTUBE_NEWS_END -->"

          if start_marker not in html or end_marker not in html:
              raise Exception(
                  "index.htmlにNEWS用マーカーがありません"
              )

          pattern = (
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker)
          )

          replacement = (
              start_marker
              + "\n"
              + generated_news
              + "\n\n  "
              + end_marker
          )

          html = re.sub(
              pattern,
              replacement,
              html,
              flags=re.DOTALL
          )

          with open(
              "index.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(html)

          print(f"完了：{len(videos)}件")

          PY

      - name: Save NEWS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "NEWSはすでに最新です"
          else
            git commit -m "Update YouTube news list"
            git push
          fi
