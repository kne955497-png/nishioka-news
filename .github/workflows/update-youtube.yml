name: Update YouTube News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Get YouTube videos and update NEWS
        run: |
          python3 <<'PY'
          import subprocess
          import json
          import re
          from datetime import datetime

          CHANNEL_URL = "https://www.youtube.com/@tube2669/videos"

          # 最新30本を取得
          result = subprocess.run(
              [
                  "yt-dlp",
                  "--flat-playlist",
                  "--playlist-end", "30",
                  "--dump-json",
                  CHANNEL_URL
              ],
              capture_output=True,
              text=True,
              check=True
          )

          lines = [
              line for line in result.stdout.splitlines()
              if line.strip()
          ]

          if not lines:
              raise Exception("YouTube動画を取得できませんでした")

          videos = []

          for line in lines:
              data = json.loads(line)

              video_id = data.get("id")
              timestamp = data.get("timestamp")
              upload_date = data.get("upload_date")

              if not video_id:
                  continue

              # 日付取得
              if upload_date and len(upload_date) == 8:
                  date = datetime.strptime(
                      upload_date,
                      "%Y%m%d"
                  ).strftime("%Y.%m.%d")

              elif timestamp:
                  date = datetime.fromtimestamp(
                      timestamp
                  ).strftime("%Y.%m.%d")

              else:
                  date = "----.--.--"

              videos.append({
                  "date": date,
                  "url": f"https://www.youtube.com/watch?v={video_id}"
              })

          if not videos:
              raise Exception("表示可能な動画がありません")

          news_items = []

          for video in videos:

              news_items.append(f'''
            <div class="news-item">

              <div class="date">
                {video["date"]}
              </div>

              <div class="message">
                YOUTUBEがUPされました！
              </div>

              <a
                class="button"
                href="{video["url"]}"
                target="_blank"
                rel="noopener noreferrer"
              >
                クリック
              </a>

            </div>''')

          generated_news = "\n".join(news_items)

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          start_marker = "<!-- YOUTUBE_NEWS_START -->"
          end_marker = "<!-- YOUTUBE_NEWS_END -->"

          if start_marker not in html or end_marker not in html:
              raise Exception(
                  "index.htmlにYOUTUBE_NEWS_START/ENDがありません"
              )

          pattern = (
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker)
          )

          replacement = (
              start_marker
              + "\n"
              + generated_news
              + "\n\n  "
              + end_marker
          )

          html = re.sub(
              pattern,
              replacement,
              html,
              flags=re.DOTALL
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print(f"{len(videos)}件の動画を取得しました")

          PY

      - name: Save NEWS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "NEWSはすでに最新です"
          else
            git commit -m "Update YouTube news list"
            git push
          fi
