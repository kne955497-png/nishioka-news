name: Update YouTube News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get YouTube videos and update NEWS
        shell: bash
        run: |
          set -e

          CHANNEL_ID="UChM1p5-nq7415z568WGx5hw"
          RSS="https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --user-agent "Mozilla/5.0" \
            "$RSS" \
            -o youtube.xml

          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from html import escape

          # YouTube RSSを読み込み
          root = ET.parse("youtube.xml").getroot()

          ns = {
              "atom": "http://www.w3.org/2005/Atom"
          }

          entries = root.findall("atom:entry", ns)

          if not entries:
              raise Exception("YouTube動画が見つかりません")

          news_items = []

          for entry in entries:

              published_element = entry.find("atom:published", ns)

              if published_element is None:
                  continue

              published = published_element.text

              video_url = None

              for link in entry.findall("atom:link", ns):
                  if link.attrib.get("rel") == "alternate":
                      video_url = link.attrib.get("href")
                      break

              if not video_url:
                  continue

              # 日本時間へ変換
              dt = datetime.fromisoformat(
                  published.replace("Z", "+00:00")
              ).astimezone(
                  ZoneInfo("Asia/Tokyo")
              )

              date = dt.strftime("%Y.%m.%d")

              video_url = escape(video_url, quote=True)

              item = f'''
            <div class="news-item">

              <div class="date">
                {date}
              </div>

              <div class="message">
                YOUTUBEがUPされました！
              </div>

              <a
                class="button"
                href="{video_url}"
                target="_blank"
                rel="noopener noreferrer"
              >
                クリック
              </a>

            </div>'''

              news_items.append(item)

          if not news_items:
              raise Exception("表示できる動画がありません")

          generated_news = "\n".join(news_items)

          # index.htmlを読み込み
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          start_marker = "<!-- YOUTUBE_NEWS_START -->"
          end_marker = "<!-- YOUTUBE_NEWS_END -->"

          if start_marker not in html or end_marker not in html:
              raise Exception(
                  "index.htmlにYOUTUBE_NEWS_START/ENDがありません"
              )

          pattern = (
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker)
          )

          replacement = (
              start_marker
              + "\n"
              + generated_news
              + "\n\n  "
              + end_marker
          )

          html = re.sub(
              pattern,
              replacement,
              html,
              flags=re.DOTALL
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("取得動画数:", len(news_items))

          PY

      - name: Save NEWS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "NEWSは最新です"
          else
            git commit -m "Update YouTube news list"
            git push
          fi
          fi
