name: Update YouTube & Instagram News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update NEWS and Instagram gallery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import html
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          key = os.environ['YOUTUBE_API_KEY']
          token = os.environ['INSTAGRAM_ACCESS_TOKEN']
          channel = 'UChM1p5-nq7415z568WGx5hw'
          jst = timezone(timedelta(hours=9))
          news = []
          gallery = []
          images_dir = Path('instagram-images')
          images_dir.mkdir(exist_ok=True)

          def api_get(base, params):
              url = base + '?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=40) as response:
                  return json.load(response)

          search = api_get('https://www.googleapis.com/youtube/v3/search', {
              'part': 'snippet', 'channelId': channel, 'maxResults': 30,
              'order': 'date', 'type': 'video', 'key': key
          })
          ids = [x.get('id', {}).get('videoId') for x in search.get('items', [])]
          ids = [x for x in ids if x]
          if ids:
              videos = api_get('https://www.googleapis.com/youtube/v3/videos', {
                  'part': 'snippet', 'id': ','.join(ids), 'key': key
              })
              for video in videos.get('items', []):
                  published = video.get('snippet', {}).get('publishedAt')
                  if not published:
                      continue
                  dt = datetime.fromisoformat(published.replace('Z', '+00:00')).astimezone(jst)
                  news.append({'datetime': dt, 'source': 'YOUTUBE',
                               'url': 'https://www.youtube.com/watch?v=' + video['id']})
          print('YouTube:', len(ids), '件')

          ig_data = api_get('https://graph.instagram.com/me/media', {
              'fields': 'id,media_type,media_url,thumbnail_url,permalink,timestamp,caption,children{media_type,media_url,thumbnail_url}',
              'limit': 50, 'access_token': token
          })
          for item in ig_data.get('data', []):
              link = item.get('permalink')
              timestamp = item.get('timestamp')
              if not link or not timestamp:
                  continue
              dt = datetime.fromisoformat(timestamp.replace('Z', '+00:00')).astimezone(jst)
              news.append({'datetime': dt, 'source': 'INSTAGRAM', 'url': link})
              kind = item.get('media_type')
              picture = item.get('thumbnail_url') if kind == 'VIDEO' else item.get('media_url')
              if kind == 'CAROUSEL_ALBUM' and not picture:
                  children = item.get('children', {}).get('data', [])
                  if children:
                      first = children[0]
                      picture = first.get('thumbnail_url') if first.get('media_type') == 'VIDEO' else first.get('media_url')
              if picture:
                  gallery.append({'datetime': dt, 'url': link, 'image': picture,
                                  'id': str(item['id']), 'caption': item.get('caption') or ''})
          print('Instagram:', len(ig_data.get('data', [])), '件; 画像:', len(gallery), '件')

          news.sort(key=lambda x: x['datetime'], reverse=True)
          gallery.sort(key=lambda x: x['datetime'], reverse=True)
          print('===== NEWS 最新10件 =====')
          for item in news[:10]:
              print(item['datetime'].strftime('%Y.%m.%d %H:%M'), item['source'], item['url'])

          entries = []
          for item in news:
              date = item['datetime'].strftime('%Y.%m.%d')
              link = html.escape(item['url'], quote=True)
              entries.append(f'''<div class="news-item">
            <div class="date">{date}</div>
            <div class="message">{item['source']}がUPされました！</div>
            <a class="button" href="{link}" target="_blank" rel="noopener noreferrer">クリック</a>
          </div>''')

          with open('index.html', encoding='utf-8') as f:
              index = f.read()
          start = '<!-- YOUTUBE_NEWS_START -->'
          end = '<!-- YOUTUBE_NEWS_END -->'
          if index.count(start) != 1 or index.count(end) != 1:
              raise RuntimeError('NEWS用マーカーが1組必要です')
          index = re.sub(re.escape(start) + r'.*?' + re.escape(end),
                         lambda m: start + '\n' + '\n'.join(entries) + '\n' + end,
                         index, count=1, flags=re.DOTALL)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index)

          tiles = []
          for item in gallery[:30]:
              image_id = re.sub(r'[^A-Za-z0-9_-]', '_', item['id'])
              image_path = images_dir / (image_id + '.jpg')
              try:
                  request = urllib.request.Request(item['image'], headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=40) as response:
                      image_bytes = response.read(12 * 1024 * 1024 + 1)
                      content_type = response.headers.get('Content-Type', '')
                  if len(image_bytes) > 12 * 1024 * 1024:
                      raise ValueError('画像サイズが12MBを超えています')
                  if not content_type.lower().startswith('image/'):
                      raise ValueError('画像以外のデータが返されました')
                  image_path.write_bytes(image_bytes)
              except Exception as exc:
                  if not image_path.exists():
                      print('画像保存失敗（スキップ）:', image_id, str(exc))
                      continue
                  print('既存画像を使用:', image_id)
              link = html.escape(item['url'], quote=True)
              date = item['datetime'].strftime('%Y.%m.%d')
              image_src = html.escape(image_path.as_posix(), quote=True)
              caption = html.escape(item['caption'])
              tiles.append(f'''<article class="slide">
                <a class="photo" href="{link}" target="_blank" rel="noopener noreferrer" aria-label="Instagram投稿 {date}"><img src="{image_src}" alt="Instagram投稿 {date}" loading="lazy"></a>
                <div class="details"><div class="date">{date}</div><div class="caption" tabindex="0">{caption if caption else 'キャプションはありません'}</div><a class="more" href="{link}" target="_blank" rel="noopener noreferrer">Instagramで見る ↗</a></div>
              </article>''')

          template = '''<!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
          *{box-sizing:border-box}
          html,body{margin:0;background:transparent;font-family:Arial,sans-serif;overflow:hidden;color:#222}
          .wrap{position:relative;width:100%;max-width:500px;margin:0 auto;padding:2px 0 22px}
          .gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
          .gallery::-webkit-scrollbar{display:none}
          .slide{flex:0 0 50%;min-width:0;padding:0 5px;scroll-snap-align:start}
          .photo{display:block;aspect-ratio:1;overflow:hidden;background:#eee}
          .photo img{width:100%;height:100%;object-fit:cover;display:block}
          .details{padding:10px 3px;text-align:left}
          .date{font-size:12px;color:#777;margin-bottom:6px}
          .caption{font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-y:auto;overflow-wrap:anywhere;max-height:125px;min-height:75px}
          .more{display:inline-block;margin-top:8px;font-size:12px;color:#555;text-decoration:underline}
          .arrow{position:absolute;top:100px;z-index:2;border:0;border-radius:50%;width:36px;height:36px;background:rgba(0,0,0,.65);color:white;font-size:24px;cursor:pointer}
          .prev{left:8px}.next{right:8px}
          .dots{display:flex;justify-content:center;gap:6px;margin-top:7px}
          .dot{width:6px;height:6px;border-radius:50%;background:#ccc}
          .dot.active{background:#333}
          @media(prefers-reduced-motion:reduce){.gallery{scroll-behavior:auto}}
          </style></head><body>
          <div class="wrap" id="wrap"><button class="arrow prev" type="button" aria-label="前の投稿">&#8249;</button><div class="gallery" id="gallery">{{TILES}}</div><button class="arrow next" type="button" aria-label="次の投稿">&#8250;</button><div class="dots" id="dots" aria-hidden="true"></div></div>
          <script>
          const gallery=document.getElementById('gallery');
          const slides=[...gallery.querySelectorAll('.slide')];
          const dots=document.getElementById('dots');
          const wrap=document.getElementById('wrap');
          const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          let current=0,timer=null,scrollTimer=null;
          const maxIndex=Math.max(0,slides.length-2);
          for(let i=0;i<=maxIndex&&i<10;i++){const dot=document.createElement('span');dot.className='dot';dots.appendChild(dot);}
          function render(){[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===current));}
          function go(i){if(!slides.length)return;current=i>maxIndex?0:i<0?maxIndex:i;gallery.scrollTo({left:slides[current].offsetLeft-slides[0].offsetLeft,behavior:reduced?'auto':'smooth'});render();}
          function stop(){if(timer!==null){clearInterval(timer);timer=null;}}
          function start(){stop();if(!reduced&&slides.length>2&&!document.hidden)timer=setInterval(()=>go(current+1),4000);}
          document.querySelector('.prev').addEventListener('click',()=>{go(current-1);start();});
          document.querySelector('.next').addEventListener('click',()=>{go(current+1);start();});
          gallery.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const step=slides.length>1?slides[1].offsetLeft-slides[0].offsetLeft:1;current=Math.min(maxIndex,Math.max(0,Math.round(gallery.scrollLeft/step)));render();},140);},{passive:true});
          wrap.addEventListener('mouseenter',stop);wrap.addEventListener('mouseleave',start);
          wrap.addEventListener('focusin',stop);wrap.addEventListener('focusout',start);
          document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start();});
          render();start();
          </script></body></html>'''
          with open('instagram.html', 'w', encoding='utf-8') as f:
              f.write(template.replace('{{TILES}}', '\n'.join(tiles)))
          print('合計NEWS:', len(news), '件 / 保存画像:', len(tiles), '件')
          PY

      - name: Save NEWS and Instagram gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html instagram.html instagram-images/
          if git diff --cached --quiet; then
            echo "NEWSとInstagram画像はすでに最新です"
          else
            git commit -m "Update news and Instagram gallery"
            git push
          fi
